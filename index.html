<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>מבצע חנוכיית הלהבות</title>
<style>
:root{--bg:#0a1030;--card:#151c4a;--gold:#f5c542;--teal:#2dd4bf;--pur:#8b5cf6;--tx:#eef1ff;--bad:#ff6b81;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#20206a,var(--bg) 60%);color:var(--tx);font:17px/1.6 system-ui,Arial,sans-serif;min-height:100vh}
#app{max-width:760px;margin:auto;padding:12px}
h1,h2{color:var(--gold);margin:.3em 0}
.card{background:var(--card);border:1px solid #3a3f8f;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 0 24px #8b5cf622}
button,select,input{font:inherit;border-radius:12px;border:1px solid var(--teal);background:#0d1338;color:var(--tx);padding:9px 14px;margin:4px 0}
button{cursor:pointer}button:hover{background:#1a2466}
.big{background:linear-gradient(90deg,var(--pur),var(--teal));border:0;font-size:1.2em;padding:12px 28px;color:#fff}
.opt{display:block;width:100%;text-align:right}
.nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nav button{flex:1;min-width:70px;font-size:.85em;padding:6px}
.nav .on{background:var(--pur)}
.bar{height:8px;background:#222a6a;border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--teal));transition:width .6s}
.fb{border-radius:12px;padding:10px 14px;margin:10px 0;animation:pop .4s}.ok{background:#0f4d45;border:1px solid var(--teal)}.no{background:#4d1626;border:1px solid var(--bad)}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.fl{width:34px;height:34px;border-radius:50% 0 50% 50%;transform:rotate(-45deg) scale(1.2);display:inline-block;box-shadow:0 0 22px 6px currentColor;animation:fk 1.2s infinite alternate}
.r2 .fl{box-shadow:0 0 15px 4px currentColor}
@keyframes fk{to{transform:rotate(-45deg) scale(1.05) translate(2px,2px);opacity:.85}}
.row{display:flex;align-items:center;gap:14px;margin:12px 0}
.fls{display:flex;justify-content:space-around;padding:22px 0}
.lock{font-size:3em;text-align:center}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #3a3f8f;padding:6px}
.dig{display:inline-block;background:var(--gold);color:#000;border-radius:10px;padding:2px 12px;font-weight:700;margin:0 3px}
input.d{width:60px;text-align:center;font-size:1.6em}
.lit{animation:lt 1s forwards;opacity:.1}@keyframes lt{to{opacity:1}}
footer{text-align:center;opacity:.7;font-size:.85em;padding:16px}
a{color:var(--teal)}
@media print{body{background:#fff;color:#000}.nav,footer,button{display:none}}
</style></head><body><div id="app"></div>

const R=[
{n:'חדר התצפיות',ic:'🔭',story:'שבע להבות מסתוריות. צפו בהדגמה מבוקרת של מבחן להבה ושימו לב לצבעים.',vid:1,tasks:[
{t:'mcq',q:'בסרטון הופיעה להבה צהובה עזה. איזה יסוד גורם לה?',o:['אשלגן','נתרן','נחושת','בריום'],a:1,why:'נתרן נותן להבה צהובה עזה, והיא הצבע הקל ביותר לזיהוי.',h:'הצבע הצהוב קשור ליסוד שנמצא במלח שולחן.'},
{t:'mcq',q:'מדוע חומרים שונים יוצרים להבות בצבעים שונים?',o:['כי יש להם טמפרטורת התכה שונה','כי לאטומים של כל יסוד יש רמות אנרגיה שונות, ולכן הם פולטים אור באורכי גל שונים','כי הלהבה סופגת צבע מהחומר','כי צבע החומר עובר ללהבה'],a:1,why:'הפרשי האנרגיה בין הרמות שונים בכל יסוד, ולכן האור הנפלט שונה (זה יורחב בחדר השלישי).',h:'חשבו על ההבדל בין האטומים של היסודות.'},
{t:'mcq',q:'איזה משפט הוא תצפית ולא הסבר מדעי?',o:['הלהבה הפכה לירוקה כשהכנסנו את הדגימה','האלקטרון קלט אנרגיה ועלה רמה','הנחושת פולטת אור באורך גל מסוים','הצבע נקבע לפי מבנה האטום'],a:0,why:'תצפית היא מה שרואים. הסבר הוא מודל שמסביר למה זה קורה.',h:'תצפית = מה שרואים בעיניים.'}]},
{n:'ארכיון הדגימות',ic:'🧪',story:'שבע התוויות נמחקו. פענחו את הדגימות. אפשר להיעזר בטבלת היסודות שמתחת למשימה. שימו לב: צבעי להבה הם אופייניים, אך לא תמיד חד-משמעיים. אם קשה, השתמשו ברמז.',tasks:[
{t:'match',q:'התאימו את צבע הלהבה למתכת:',p:N.map(x=>['<span class="fl" style="color:'+C[x[0]]+';background:'+C[x[0]]+'"></span> <small>('+x[2]+')</small>',x[1]]),why:'כל ההתאמות נכונות. ליתיום, סטרונציום וסידן נראים דומים באדום-כתום, ולכן דרושה זהירות.',h:'התחילו מהקלים: נתרן צהוב, נחושת כחול-ירקרק, בריום ירוק. נפתחה לכם הדמיית ההדלקה: הדליקו כל דגימה וראו את הצבע ואת שם החומר.'},
{t:'mcq',q:'בטבלת תלמיד נכתב: ״אשלגן – כתום-אדום, סידן – סגול-לילך״. מה הטעות?',o:['אין טעות','החליפו בין אשלגן לסידן','נתרן חסר','שני הצבעים שגויים והיסודות נכונים'],a:1,why:'אשלגן הוא סגול-לילך וסידן כתום-אדום. התלמיד החליף ביניהם.',h:'בדקו את שני היסודות מול הצבעים בפעילות הקודמת.'},
{t:'mcq',q:'בדגימה לא ידועה נראתה להבה צהובה עזה שכיסתה כל צבע אחר. מה המסקנה הזהירה?',o:['הדגימה היא נתרן נקי, בוודאות','ייתכן זיהום בנתרן שמסתיר צבעים אחרים, ולכן כדאי לחזור על הבדיקה בדגימה נקייה','אין בדגימה אף מתכת','הניסוי נכשל ואי אפשר ללמוד ממנו דבר'],a:1,why:'כמויות קטנות של נתרן נמצאות כמעט בכל מקום, והצהוב החזק עלול למסך צבעים אחרים.',h:'הצהוב של הנתרן חזק מאוד.'}]},
{n:'סוד האטום',ic:'⚛️',story:'הפעילו את האנימציה שלב אחר שלב, ואז פתרו את המשימות.',atom:1,tasks:[
{t:'order',q:'סדרו את שלבי התהליך בסדר הנכון (לחצו לפי הסדר):',it:['האטום קולט אנרגיה','האלקטרון עובר לרמת אנרגיה גבוהה יותר','האלקטרון חוזר לרמת אנרגיה נמוכה יותר','נפלט פוטון אור'],why:'האנרגיה שנפלטת בחזרה היא אור, וצבעו נקבע לפי הפרש האנרגיה.',h:'מתחילים בקליטת אנרגיה ומסיימים באור.'},
{t:'match',q:'התאימו מושג להגדרה:',p:[['אנרגיה','מה שהאטום קולט מהלהבה'],['אלקטרון','חלקיק בעל מטען שלילי באטום'],['פוטון','״מנת״ אור הנפלטת'],['אורך גל','מאפיין של האור שקשור לצבעו']],why:'מושגי היסוד של פליטת אור.',h:'פוטון הוא מנה של אור.'},

{n:'חדר החקירות',ic:'🕵️',story:'תיק חקירה: דגימה X נבדקה. התקבלה להבה ירוקה-כחולה. שני חוקרים הגיבו.',file:1,tasks:[
{t:'mcq',q:'איזה חוקר מסיק מסקנה מוצדקת?',o:['חוקר א׳: זו נחושת בוודאות, ההוכחה סופית','חוקר ב׳: התוצאה מתאימה לנחושת, אך כדי לאשר צריך בדיקה נוספת','שניהם צודקים','שניהם טועים'],a:1,why:'התאמה של תוצאה להשערה אינה הוכחה חד-משמעית.',h:'ההבדל בין ״מתאים ל״ לבין ״בוודאות״.'},
{t:'mcq',q:'מהי מגבלה של מבחן להבה?',o:['הוא מדויק לחלוטין','זיהום ויסודות בעלי צבע דומה עלולים להטעות','הוא עובד רק על נחושת','הוא לא מפיק צבעים'],a:1,why:'המבחן הוא כלי ראשוני, ולא תמיד חד-משמעי.',h:'נזכרו בחדר הארכיון.'},
{t:'mcq',q:'בדגימה אחרת לא נראה צבע בולט. האם אפשר לקבוע שאין בה מתכות?',o:['כן','לא, יש יסודות שאינם נותנים צבע ניכר, ולכן אי אפשר לשלול','כן אם הלהבה כחולה','רק אם הדגימה לבנה'],a:1,why:'היעדר צבע אינו הוכחה להיעדר יסודות.',h:'האם כל יסוד צובע להבה?'}]}

function sections(){const k=S.scr,ft='<footer>עריכה: מילכה ברקו גרש</footer>';
if(typeof k!=='number')return [['nav',nav()],['m',(k=='intro'?intro():k=='vault'?vault():end())+ft]];
return [['nav',nav()],...room(k),['ft',ft]]}
function render(){const a=$('#app'),sc=S.scr,secs=sections().map(x=>[sc+'-'+x[0],x[1]]),ch=[...a.children];
if(ch.length!==secs.length||secs.some((x,i)=>ch[i].dataset.k!==x[0])){a.innerHTML='';secs.forEach(x=>{const e=document.createElement('div');e.dataset.k=x[0];e.innerHTML=x[1];e._h=x[1];a.appendChild(e)})}
else secs.forEach((x,i)=>{if(ch[i]._h!==x[1]){ch[i].innerHTML=x[1];ch[i]._h=x[1]}});
a.className=sc===1?'r2':'';
if(sc==='vault')setTimeout(()=>{const v=$('#v0');if(v&&!document.activeElement.id.startsWith('v'))v.focus()},0)}
if(S.scr!=='intro'&&!can(S.scr))S.scr='intro';render();
</script></body></html>
